name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release-Entwurf mit Installer anlegen (nur für Leute mit Schreibrecht sichtbar)"
        type: boolean
        default: false
      publish:
        description: "Gleich veröffentlichen statt Entwurf (Version aus Directory.Build.props, legt den Tag an)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Release runs get their own group so a push to the branch does not cancel them.
  group: build-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test tests/Blitztext.Core.Tests --configuration Release --logger "console;verbosity=normal"
      - name: Speech tests (audio, download, extraction)
        run: dotnet test tests/Blitztext.Speech.Tests --configuration Release --logger "console;verbosity=normal"

  windows:
    name: Windows app, self-test and installer
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $informational = $version
          } elseif ("${{ inputs.publish }}" -eq "true") {
            $version = (Select-Xml -Path Directory.Build.props -XPath "//Version" | Select-Object -First 1).Node.InnerText
            $informational = $version
          } else {
            $version = (Select-Xml -Path Directory.Build.props -XPath "//Version" | Select-Object -First 1).Node.InnerText
            $informational = "$version-ci.${{ github.run_number }}+$("${{ github.sha }}".Substring(0, 7))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "informational=$informational" >> $env:GITHUB_OUTPUT

      - name: Unit tests (Windows)
        run: dotnet test tests/Blitztext.Core.Tests --configuration Release

      - name: Publish
        run: >
          dotnet publish src/Blitztext.Windows/Blitztext.Windows.csproj
          --configuration Release
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational }}

      - name: Speech sample for the self-test
        shell: powershell
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $synth.GetInstalledVoices() | ForEach-Object { Write-Host $_.VoiceInfo.Name $_.VoiceInfo.Culture }
          $synth.SetOutputToWaveFile("$PWD\speech.wav")
          $synth.Speak("Hello, this is a short test of the dictation app. The quick brown fox jumps over the lazy dog.")
          $synth.Dispose()
          Get-Item speech.wav

      # A virtual cable as microphone, so the self-test can dictate from shortcut to text.
      - name: Virtual microphone (VB-CABLE)
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1

      - name: Audio devices
        shell: pwsh
        continue-on-error: true
        run: |
          # "Let desktop apps access your microphone" is off on the runner.
          foreach ($key in @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged')) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
          }
          Set-Service audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service audiosrv -ErrorAction SilentlyContinue
          Get-Service audiosrv, AudioEndpointBuilder | Format-Table -AutoSize Name, Status
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table -AutoSize FriendlyName, Status

      - name: Self-test (pages, clipboard, keyboard hook, models, dictation, transcription)
        shell: pwsh
        run: |
          $arguments = @("--self-test", "$PWD\selftest", "--install-models")
          if (Test-Path speech.wav) { $arguments += @("--audio", "$PWD\speech.wav") }
          $process = Start-Process -FilePath publish\Blitztext.exe -ArgumentList $arguments -PassThru -Wait
          Get-Content selftest\selftest.log
          Write-Host "--- app log (never contains dictated text) ---"
          Get-Content selftest\home\Local\logs\blitztext.log -Tail 60 -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)" }

      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest/*.png
            selftest/selftest.log
            selftest/home/Local/logs/*.log
          if-no-files-found: ignore

      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DPublishDir=$PWD\publish" installer\Blitztext.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path publish\* -DestinationPath "dist\Blitztext-${{ steps.version.outputs.version }}-portable-win-x64.zip"
          Get-ChildItem dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Blitztext-Windows
          path: dist/*

  # A tag v* publishes a release; a manual run with "release" makes a draft that only people
  # with write access see, for downloading the installer without publishing it.
  release:
    name: GitHub release
    if: github.ref_type == 'tag' || inputs.release
    needs: [tests, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Blitztext-Windows
          path: dist
      - name: Prepare the draft (manual runs)
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.windows.outputs.version }}
        run: |
          # A manual run must never change a published release. Only a 404 means there is none.
          if out=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2>&1); then
            echo "::error::$TAG ist schon veröffentlicht. Zuerst die Version in Directory.Build.props erhöhen."
            exit 1
          elif [[ $out != *"(HTTP 404)"* ]]; then
            echo "$out" >&2
            exit 1
          fi
          # Replace an older draft so the new one points at this commit.
          gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            xargs -r -I{} gh api -X DELETE "repos/$GH_REPO/releases/{}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.windows.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Blitztext Windows ${{ needs.windows.outputs.version }}
          draft: ${{ github.ref_type != 'tag' && !inputs.publish }}
          files: dist/*
          generate_release_notes: true
