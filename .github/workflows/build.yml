name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test tests/Blitztext.Core.Tests --configuration Release --logger "console;verbosity=normal"
      - name: Speech tests (audio, download, extraction)
        run: dotnet test tests/Blitztext.Speech.Tests --configuration Release --logger "console;verbosity=normal"

  windows:
    name: Windows app, self-test and installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $informational = $version
          } else {
            $version = "1.0.0"
            $informational = "1.0.0-ci.${{ github.run_number }}+$("${{ github.sha }}".Substring(0, 7))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "informational=$informational" >> $env:GITHUB_OUTPUT

      - name: Unit tests (Windows)
        run: dotnet test tests/Blitztext.Core.Tests --configuration Release

      - name: Publish
        run: >
          dotnet publish src/Blitztext.Windows/Blitztext.Windows.csproj
          --configuration Release
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational }}

      - name: Speech sample for the self-test
        shell: powershell
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $synth.GetInstalledVoices() | ForEach-Object { Write-Host $_.VoiceInfo.Name $_.VoiceInfo.Culture }
          $synth.SetOutputToWaveFile("$PWD\speech.wav")
          $synth.Speak("Hello, this is a short test of the dictation app. The quick brown fox jumps over the lazy dog.")
          $synth.Dispose()
          Get-Item speech.wav

      - name: Self-test (pages, clipboard, keyboard hook, models, transcription)
        shell: pwsh
        run: |
          $arguments = @("--self-test", "$PWD\selftest", "--install-models")
          if (Test-Path speech.wav) { $arguments += @("--audio", "$PWD\speech.wav") }
          $process = Start-Process -FilePath publish\Blitztext.exe -ArgumentList $arguments -PassThru -Wait
          Get-Content selftest\selftest.log
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)" }

      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest/*.png
            selftest/selftest.log
            selftest/home/Local/logs/*.log
          if-no-files-found: ignore

      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DPublishDir=$PWD\publish" installer\Blitztext.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path publish\* -DestinationPath "dist\Blitztext-${{ steps.version.outputs.version }}-portable-win-x64.zip"
          Get-ChildItem dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Blitztext-Windows
          path: dist/*

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [tests, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Blitztext-Windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
