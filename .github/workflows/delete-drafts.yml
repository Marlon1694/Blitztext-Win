name: Delete draft releases

# Manual clean-up: removes every draft release (published releases stay).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft) | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "Deleting draft $name ($id)"
              gh api -X DELETE "repos/$GH_REPO/releases/$id"
            done
